name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 镜像已预装 Android SDK，但不导出 ANDROID_HOME / ANDROID_SDK_ROOT，
      # 所以这里显式定位 cmdline-tools 并把 SDK 路径写进 GITHUB_ENV，供后面构建步骤使用。
      - name: Set up Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          CMDLINE_BIN=$(dirname "$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)")
          if [ -z "$CMDLINE_BIN" ] || [ "$CMDLINE_BIN" = "." ]; then
            echo "未找到 sdkmanager，实际目录结构如下："
            find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -print
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          export PATH="$CMDLINE_BIN:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 应用内自动更新靠这个文件比较版本：App 读 versionCode 判断是否需要升级
      - name: Write version manifest
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          printf '{"versionCode":%s,"versionName":"%s","tag":"v%s"}\n' \
            "$CODE" "$NAME" "${{ github.run_number }}" > version.json
          cat version.json

      - name: Publish APK as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: WorkBuddy Hub build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            version.json
          draft: false
          prerelease: false
